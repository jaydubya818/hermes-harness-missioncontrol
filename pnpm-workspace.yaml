packages:
  - apps/*
  - packages/*

# Supply-chain hardening: refuse to resolve package versions published less
# than 3 days ago (in minutes), giving the registry time to catch and unpublish
# compromised releases before they can land here on install/update.
minimumReleaseAge: 4320

# Force patched versions of vulnerable transitive dev dependencies. Each floor
# is the advisory's own first_patched_version for that major line, read from
# the GitHub advisory API rather than from a changelog:
# - js-yaml <4.3.1 (GHSA-5p4m-2wfm-xmqj, prototype pollution) via openapi-typescript
# - nanoid <3.3.18 (GHSA-2v37-7h3g-55p8, infinite loop) via vite>postcss
overrides:
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1"
  "nanoid@<3.3.18": ">=3.3.18"
